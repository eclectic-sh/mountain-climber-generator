[project]
name = "mountain-climber-generator"
version = "0.0.0"
description = "Local browser generator for Mountain Climber"
requires-python = ">=3.14,<3.15"
license = "MIT"

[tool.ruff]
line-length = 100
target-version = "py314"
exclude = ["python/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
